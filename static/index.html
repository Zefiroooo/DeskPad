<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeskPad</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-200 h-dvh w-screen p-4 overflow-hidden">
    <div class="flex flex-col h-full w-full gap-4">
        <span class="text-lg text-center text-slate-700 font-bold rounded bg-slate-100 p-2 ">DeskPad</span>
        
        <!-- Voice Status Banner -->
        <div id="voice-feedback" class="hidden px-3 py-1.5 bg-indigo-50 border border-indigo-200 text-indigo-800 rounded-xl text-xs font-medium text-center transition-all flex items-center justify-center gap-1.5 shadow-sm">
            <span id="voice-feedback-icon">🎙️</span>
            <span id="voice-feedback-text">Mendengarkan...</span>
        </div>
        
        <div class="flex rounded-xl bg-white gap-4">
            <button id="touchpad-switch" class="flex-1 p-2 text-sm font-semibold text-slate-800 rounded-xl flex justify-center items-center bg-slate-100">
                <span>🖱️</span>
                <span class=" ">Touchpad</span>
            </button>
            <button id="presenter-switch" class="flex-1 p-2 text-sm font-semibold text-slate-800 rounded-xl flex justify-center items-center ">
                <span>📽️</span>
                <span class=" ">Presenter</span>
            </button>
        </div>
        
        <!-- TouchPad Mode -->
        <div id="touchpad-mode" class="flex flex-col flex-1 gap-4">
            <div id="touchpad" class="flex flex-1 rounded-3xl bg-white justify-center"></div>
            <div>
                <div class="flex h-28 gap-4">
                    <button id="left-click" class="flex-1 bg-white rounded font-medium font-semibold hover:bg-slate-300">left click</button>
                    <button id="right-click" class="flex-1 bg-white rounded font-medium font-semibold hover:bg-slate-300">right click</button>
                </div>
            </div>
        </div>

        <!-- Presenter Mode -->
        <!-- Presenter Mode (flex flex-col flex-1 gap-4) -->
        <div id="presenter-mode" class="flex flex-col flex-1 gap-4 hidden">
            <!-- 1. Tombol Utama (Prev & Next) -> Mengisi seluruh ruang tengah layar (flex-1) -->
            <div class="flex flex-1 gap-4">
                <button id="prev-button" class="flex-1 bg-white rounded-3xl shadow-sm flex flex-col items-center justify-center font-bold text-slate-700 text-xl active:bg-slate-200 transition-colors">
                    <span class="text-3xl mb-1">⬅️</span>
                    <span>Prev</span>
                </button>
                <button id="next-button" class="flex-1 bg-white rounded-3xl shadow-sm flex flex-col items-center justify-center font-bold text-slate-700 text-xl active:bg-slate-200 transition-colors">
                    <span class="text-3xl mb-1">➡️</span>
                    <span>Next</span>
                </button>
            </div>
            <!-- 2. Tombol Bawah (Start & Stop) -> Tinggi proporsional h-24 -->
            <div class="flex h-24 gap-4">
                <button id="start-button" class="flex-1 bg-white rounded-2xl shadow-sm flex items-center justify-center font-bold text-slate-700 active:bg-slate-200 transition-colors">
                    ▶️ Start
                </button>
                <button id="exit-button" class="flex-1 bg-white rounded-2xl shadow-sm flex items-center justify-center font-bold text-rose-600 active:bg-slate-200 transition-colors">
                    ❌ Stop (Esc)
                </button>
            </div>

            <div class="flex h-24 gap-4">
                <button id="blank-button" class="flex-1 bg-white rounded-2xl shadow-sm flex items-center justify-center font-bold text-slate-700 active:bg-slate-200 transition-colors">
                    ⬛ Blank Screen
                </button>
                <button id="voice-button" class="flex-1 bg-white rounded-2xl shadow-sm flex items-center justify-center font-bold text-indigo-600 active:bg-slate-200 transition-all select-none">
                    <span id="voice-icon" class="mr-1.5 text-xl">🎙️</span>
                    <span id="voice-label">Kontrol Suara</span>
                </button>
            </div>
        </div>


    </div>


    <script src="/static/app.js">
      
    </script>
</body>
</html>
