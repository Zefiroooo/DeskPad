<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeskPad</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-200 h-screen w-screen p-4 overflow-hidden">
    <div class="flex flex-col h-full w-full gap-4">
        <span class="text-lg text-center text-slate-700 font-bold rounded bg-slate-100 p-2 ">DeskPad</span>
        <div id="touchpad" class="flex flex-1 rounded-3xl bg-white justify-center"></div>
        <div>
            <div class="flex h-28 gap-4">
                <button id="left-click" class="flex-1 bg-white rounded font-medium font-semibold hover:bg-slate-300">left click</button>
                <button id="right-click" class="flex-1 bg-white rounded font-medium font-semibold hover:bg-slate-300">right click</button>
            </div>

        </div>
    </div>

    <script>
        
        // window.location.host otomatis membaca IP dan Port laptop tempat halaman web ini dibuka
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

        const pad = document.getElementById('touchpad');

        pad.addEventListener('touchstart', (e) => {
            lastX = e.touches[0].clientX
            lastY = e.touches[0].clientY
        });

        pad.addEventListener('touchmove', (e) => {
            e.preventDefault()
            
            const currentX = e.touches[0].clientX
            const currentY = e.touches[0].clientY
            
            if (e.touches.length === 1) {
    
                const dx = currentX - lastX
                const dy = currentY - lastY
    
                lastX = currentX
                lastY = currentY
    
                if (socket.readyState == WebSocket.OPEN) {
    
                    socket.send(JSON.stringify({
                        type: "move",
                        dx : Math.round(dx),
                        dy : Math.round(dy)
                    }));
                }
            } else if (e.touches.length === 2) {
                const dy = currentY - lastY
                lastY = currentY

                if(socket.readyState == WebSocket.OPEN)
                socket.send(JSON.stringify({
                    type : "scroll",
                    dy : Math.round(dy)
            }))
            }

        })

    </script>
</body>
</html>
